name: Update earthquakes

# The `data` branch is the database: every record each source has given us, as plain files.
# Each run rebuilds a working database from it (a few seconds), fetches what is new, commits the
# changes back to `data`, and publishes the site. Nothing else needs to survive between runs.
#
# The page reads IPMA's feed and EMSC's live feed itself, so it stays current between runs;
# these jobs exist to keep what the sources publish before it scrolls out of their feeds
# (IPMA keeps about 30 days).

on:
  schedule:
    - cron: "17 * * * *"     # live: IPMA's feed + the last 2 days of EMSC
    - cron: "23 3 * * *"     # daily: + the last 60 days of EMSC and USGS
    - cron: "47 4 2 * *"     # monthly: + the last 3 years of the ISC Bulletin
  workflow_dispatch:
    inputs:
      mode:
        description: What to fetch
        type: choice
        options: [live, daily, monthly, backfill]
        default: live
  push:
    branches: [main]
    paths: ["site/**", "content/**", "hosting/**", "tools/build_content.py", "tools/build_site.py", "tools/site_archive.py", "tools/render_home.mjs", "wrangler.jsonc", "package*.json", "quake/**", "update.py", ".github/workflows/update.yml"]

permissions:
  contents: write  # to commit to the data branch

concurrency:
  group: earthquakes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
      url: https://terramotos.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Check the feed exporter
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check out the data branch
        run: |
          if git fetch --depth 1 origin data; then
            git worktree add -B data archive FETCH_HEAD
          else
            git worktree add --detach archive
            git -C archive switch --orphan data
          fi

      - name: Choose what to fetch
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*)      mode="${{ inputs.mode }}" ;;
            schedule:"23 3 * * *")    mode=daily ;;
            schedule:"47 4 2 * *")    mode=monthly ;;
            push:*)                   mode=export ;;
            *)                        mode=live ;;
          esac
          # nothing archived yet (the very first run): download the whole history
          if [ ! -e archive/state.json ]; then mode=backfill; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Update (${{ steps.mode.outputs.mode }})
        run: python3 update.py ${{ steps.mode.outputs.mode }} --archive archive

      - name: Commit new records to the data branch
        if: steps.mode.outputs.mode != 'export'
        run: |
          cd archive
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "${{ steps.mode.outputs.mode }} update, $(date -u +'%F %H:%M') UTC"
            git push origin HEAD:refs/heads/data
          fi

      # the whole catalogue as one download, attached to a release that is updated in place
      - name: Publish the dataset
        if: contains(fromJSON('["daily", "monthly", "backfill"]'), steps.mode.outputs.mode)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          python3 update.py csv dist/terramotos-portugal.csv
          cp DATA.md dist/README.md
          (cd dist && zip -9 -q terramotos-portugal.zip terramotos-portugal.csv README.md)
          notes="Every recorded earthquake in mainland Portugal, the Azores and Madeira since 1909: $(($(wc -l < dist/terramotos-portugal.csv) - 1)) earthquakes as of $(date -u +%F). The zip holds one CSV and a README with the columns, the sources and the terms of use. This file is replaced as the catalogue is updated."
          if gh release view dataset >/dev/null 2>&1; then
            gh release upload dataset dist/terramotos-portugal.zip --clobber
            gh release edit dataset --notes "$notes"
          else
            gh release create dataset dist/terramotos-portugal.zip --title "Dataset" --notes "$notes"
          fi

      - name: Build the earthquake pages' text
        run: python3 tools/build_content.py

      - name: Install the pinned deployment tools
        run: npm ci

      - name: Check the earthquake page server
        run: npm run test:hosting

      - name: Build for terramotos.com
        run: python3 tools/build_site.py

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler deploy

      # after publishing, so a long outage of one source turns the run red without stopping the site
      - name: Check for sources that have been failing for more than a day
        if: steps.mode.outputs.mode != 'export'
        run: python3 update.py check
