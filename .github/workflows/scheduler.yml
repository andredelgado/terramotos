name: Scheduler checks

on:
  push:
    branches: [main]
    paths: ["scheduler/**", ".github/workflows/scheduler.yml"]
  pull_request:
    paths: ["scheduler/**", ".github/workflows/scheduler.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scheduler/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm exec -- wrangler deploy --dry-run --outdir /tmp/terramotos-watchdog-build
