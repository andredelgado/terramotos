name: Python checks

on:
  push:
    branches: [main]
    paths: ["quake/**", "update.py", "content/**", "site/content/**", "tools/build_content.py", "tools/build_site.py", "tests/test_*.py", ".github/workflows/python.yml"]
  pull_request:
    paths: ["quake/**", "update.py", "content/**", "site/content/**", "tools/build_content.py", "tools/build_site.py", "tests/test_*.py", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # Keep Python 3.9 available; Ubuntu 26.04 has no build for it.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
