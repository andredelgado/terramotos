name: Python checks

on:
  push:
    branches: [main]
    paths: ["quake/**", "update.py", "tests/test_*.py", ".github/workflows/python.yml"]
  pull_request:
    paths: ["quake/**", "update.py", "tests/test_*.py", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
