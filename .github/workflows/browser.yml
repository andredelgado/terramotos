name: Browser checks

on:
  push:
    branches: [main]
    paths: ["site/**", "tests/browser/**", "tests/analytics.test.js", "package*.json", "playwright.config.js", "eslint.config.js", ".github/workflows/browser.yml"]
  pull_request:
    paths: ["site/**", "tests/browser/**", "tests/analytics.test.js", "package*.json", "playwright.config.js", "eslint.config.js", ".github/workflows/browser.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:analytics
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
