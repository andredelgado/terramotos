name: Browser checks

on:
  push:
    branches: [main]
    paths: ["site/**", "hosting/**", "tests/browser/**", "tests/analytics.test.js", "package*.json", "playwright.config.js", "eslint.config.js", ".github/workflows/browser.yml"]
  pull_request:
    paths: ["site/**", "hosting/**", "tests/browser/**", "tests/analytics.test.js", "package*.json", "playwright.config.js", "eslint.config.js", ".github/workflows/browser.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Keep browser system dependencies on a fixed Ubuntu release, like the Python checks.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:analytics
      - run: npm run test:hosting
      - run: npm test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
