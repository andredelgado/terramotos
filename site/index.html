<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terramotos Portugal</title>
<meta name="description" content="Every recorded earthquake in mainland Portugal, the Azores and Madeira since 1909, on a seismograph drum. Data from IPMA, the ISC Bulletin, EMSC and USGS.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<meta name="goatcounter" content="https://terramotos.goatcounter.com/count">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Terramotos Portugal" href="rss.xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Terramotos Portugal">
<meta property="og:description" content="Every recorded earthquake in mainland Portugal, the Azores and Madeira since 1909, on a seismograph drum.">
<meta property="og:url" content="https://terramotos.com/">
<meta property="og:image" content="https://terramotos.com/share.png">
<link rel="canonical" href="https://terramotos.com/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script>
// apply a saved theme before first paint; without one the system setting decides
try { const t = localStorage.getItem('seis.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="stylesheet" href="app.css">
<link rel="modulepreload" href="js/card.js">
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/content/land.js">
<link rel="modulepreload" href="js/controls.js">
<link rel="modulepreload" href="js/dom.js">
<link rel="modulepreload" href="js/drum.js">
<link rel="modulepreload" href="js/feeds.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/latest.js">
<link rel="modulepreload" href="js/list.js">
<link rel="modulepreload" href="js/map/colour.js">
<link rel="modulepreload" href="js/map/geography.js">
<link rel="modulepreload" href="js/map/panels.js">
<link rel="modulepreload" href="js/map/period.js">
<link rel="modulepreload" href="js/map/play.js">
<link rel="modulepreload" href="js/page.js">
<link rel="modulepreload" href="js/rail.js">
<link rel="modulepreload" href="js/selection.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/stats.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/text.js">
<link rel="modulepreload" href="js/theme.js">
<link rel="modulepreload" href="js/url.js">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/views.js">
</head>
<body>

<header class="top">
  <h1><span data-i18n="homeHeading">Earthquakes in Portugal</span> <span class="count"><span id="count"></span><span class="unit" data-i18n="unit"> earthquakes</span></span></h1>
  <div class="controls">
    <div class="seg" role="group" aria-label="View" data-i18n-aria="aView" id="views">
      <button type="button" data-view="drum" aria-pressed="true" data-i18n-aria="vDrum"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h3l1.5-4 2 8.5 2-7L11 8h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="view-label" data-i18n="vDrum">Seismograph</span></button>
      <button type="button" data-view="list" aria-pressed="false" data-i18n-aria="vList"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="view-label" data-i18n="vList">List</span></button>
      <button type="button" data-view="map" aria-pressed="false" data-i18n-aria="vMap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m1.5 3 4-1.5 5 2 4-1.5v11l-4 1.5-5-2-4 1.5zM5.5 1.5v11m5-9v11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="view-label" data-i18n="vMap">Map</span></button>
      <button type="button" data-view="stats" aria-pressed="false" data-i18n-aria="vStats"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14V8m5 6V2m5 12V5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="view-label" data-i18n="vStats">Statistics</span></button>
    </div>
    <div class="seg" role="group" aria-label="Time per line" data-i18n-aria="aSpans" id="spans">
      <button type="button" data-span="3h" aria-pressed="true">3h</button>
      <button type="button" data-span="1d" aria-pressed="false" data-i18n="s1d">Day</button>
      <button type="button" data-span="1w" aria-pressed="false" data-i18n="s1w">Week</button>
      <button type="button" data-span="1mo" aria-pressed="false" data-i18n="s1mo">Month</button>
      <button type="button" data-span="1y" aria-pressed="false" data-i18n="s1y">Year</button>
    </div>
    <div class="seg" role="group" data-i18n-aria="aPeriod" id="periods" hidden>
      <button type="button" data-period="24h" aria-pressed="true">24h</button>
      <button type="button" data-period="7d" aria-pressed="false" data-i18n="p7d">7d</button>
      <button type="button" data-period="30d" aria-pressed="false" data-i18n="p30d">30d</button>
      <button type="button" data-period="1y" aria-pressed="false" data-i18n="p1y">1y</button>
      <button type="button" data-period="all" aria-pressed="false" data-i18n="pAll">All</button>
      <button type="button" data-period="view" aria-pressed="false" data-i18n="pView" hidden>View</button>
    </div>
    <div class="seg" role="group" data-i18n-aria="aStatsPeriod" id="speriods" hidden>
      <button type="button" data-sp="all" aria-pressed="true" data-i18n="pAll">All</button>
      <button type="button" data-sp="10y" aria-pressed="false" data-i18n="p10y">10y</button>
      <button type="button" data-sp="1y" aria-pressed="false" data-i18n="p1y">1y</button>
      <button type="button" data-sp="30d" aria-pressed="false" data-i18n="p30d">30d</button>
    </div>
    <select id="mag" aria-label="Minimum magnitude" data-i18n-aria="aMag">
      <option value="all" data-i18n="mag">Magnitude</option>
      <option value="2">M 2+</option>
      <option value="3">M 3+</option>
      <option value="4">M 4+</option>
      <option value="5">M 5+</option>
    </select>
    <select id="region" aria-label="Region" data-i18n-aria="region">
      <option value="all" data-i18n="region">Region</option>
      <option value="0" data-i18n="r0">Mainland</option>
      <option value="1" data-i18n="r1">Azores</option>
      <option value="2" data-i18n="r2">Madeira</option>
    </select>
    <select id="jump" aria-label="Jump to" data-i18n-aria="aJump">
      <option value="" data-i18n="jump">Jump to…</option>
    </select>
  </div>
  <a class="icon" id="lang" href="/" hreflang="pt" lang="pt" aria-label="PT · Mudar para português">PT</a>
  <button class="icon" id="theme" type="button" aria-label="Switch between light and dark" data-i18n-aria="aTheme">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
  </button>
</header>

<div class="status">
  <span id="latest"><!-- latest-event --></span>
  <span class="right"><span id="range"></span><span id="freshness" aria-live="polite"></span><span id="inview"></span></span>
</div>

<main>
  <div class="drum" id="drum" role="region" tabindex="0" data-i18n-aria="aDrum" aria-label="Seismograph drum. Each line is a slice of time, newest on top; the waves are earthquakes. Scroll down to go back in time.">
    <canvas id="drumCanvas"></canvas>
    <div id="spacer"></div>
  </div>
  <div class="list" id="list" hidden>
    <table role="grid" tabindex="0" data-i18n-aria="aList">
      <thead><tr aria-rowindex="1"><th scope="col" data-i18n="cTime">Time (UTC)</th><th scope="col" data-i18n-aria="mag"><span class="full" data-i18n="mag">Magnitude</span><span class="compact" aria-hidden="true">M</span></th><th scope="col" data-i18n="cPlace">Place</th><th scope="col" class="opt" data-i18n="region">Region</th><th scope="col" class="opt" data-i18n="cDepth">Depth</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="atlas" id="atlas" hidden>
    <p class="atlas-empty" id="mapEmpty" data-i18n="none" hidden>No earthquakes match these filters.</p>
    <div class="map-panels" id="mapPanels">
      <section class="map-panel" data-region="0" aria-labelledby="mapName0">
        <header><h2 id="mapName0" data-i18n="r0">Mainland</h2><span class="map-count"></span></header>
        <canvas class="map-plot" tabindex="0" role="group"></canvas>
      </section>
      <section class="map-panel" data-region="1" aria-labelledby="mapName1">
        <header><h2 id="mapName1" data-i18n="r1">Azores</h2><span class="map-count"></span></header>
        <canvas class="map-plot" tabindex="0" role="group"></canvas>
      </section>
      <section class="map-panel" data-region="2" aria-labelledby="mapName2">
        <header><h2 id="mapName2" data-i18n="r2">Madeira</h2><span class="map-count"></span></header>
        <canvas class="map-plot" tabindex="0" role="group"></canvas>
      </section>
    </div>
    <div class="map-play">
      <button type="button" class="icon" id="playBtn" aria-pressed="false"></button>
      <input type="range" id="scrub" min="0" max="1000" value="1000" data-i18n-aria="aScrub">
      <span id="playAt"></span>
    </div>
    <div class="map-legend">
      <span class="sizes" aria-hidden="true">
        <svg width="14" height="44" viewBox="0 0 14 44"><circle cx="7" cy="37" r="6.5"/><circle class="c" cx="7" cy="37" r="2"/></svg>
        <svg width="27" height="44" viewBox="0 0 27 44"><circle cx="13.5" cy="30.5" r="13"/><circle class="c" cx="13.5" cy="30.5" r="2"/></svg>
        <svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21.4"/><circle class="c" cx="22" cy="22" r="2"/></svg>
      </span>
      <span data-i18n="lSizes">Magnitude 2, 4 and 6</span>
      <select id="colour" data-i18n-aria="aColour">
        <option value="none" data-i18n="cNone">One colour</option>
        <option value="depth" data-i18n="cByDepth">Colour by depth</option>
        <option value="age" data-i18n="cByAge">Colour by age</option>
      </select>
      <span class="ramp" id="ramp" hidden></span>
      <span class="layers" role="group" aria-label="Map layers" data-i18n-aria="aLayers" id="layers">
        <button type="button" data-layer="plates" aria-pressed="true"><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path class="dash" d="M0 4h22"/></svg><span data-i18n="lPlate">Plate boundaries</span></button>
        <button type="button" data-layer="faults" aria-pressed="false"><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path d="M0 6l7-4 6 3 9-3"/></svg><span data-i18n="lFaults">Active faults</span></button>
        <button type="button" data-layer="volcanoes" aria-pressed="false"><svg width="10" height="9" viewBox="0 0 10 9" aria-hidden="true"><path d="M5 1l4 7H1z"/></svg><span data-i18n="lVolc">Volcanoes</span></button>
      </span>
    </div>
  </div>
  <div class="stats" id="stats" hidden></div>
  <div class="rail" id="railBox" tabindex="0" role="slider" data-i18n-aria="aRail" aria-label="Timeline, newest at the top. Click or drag to travel in time." aria-valuemin="1909" aria-valuemax="2026" aria-valuenow="2026">
    <canvas id="rail"></canvas>
  </div>
  <div class="tip" id="tip" role="status" hidden></div>
</main>

<footer>
  <span><span data-i18n="data">Data:</span> <a href="https://www.ipma.pt/pt/geofisica/sismicidade/" target="_blank" rel="noopener">IPMA</a>, <a href="https://www.isc.ac.uk/" target="_blank" rel="noopener">ISC</a>, <a href="https://www.seismicportal.eu/" target="_blank" rel="noopener">EMSC</a>, <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS</a></span>
  <div class="footer-links"><a href="rss.xml" type="application/rss+xml">RSS</a> · <span data-i18n="utc">Times in UTC</span> ·
    <details id="catalogue"><summary data-i18n="browse">Browse catalogue</summary>
      <div class="catalogue-panel"><!-- year-archive --><!-- recent-events -->
        <h2 data-i18n="stories">Stories</h2><ul id="catalogueStories"><!-- historical-stories --></ul><!-- updated -->
      </div>
    </details> · <button type="button" id="aboutBtn" data-i18n="about">About</button>
  </div>
</footer>

<dialog id="about" aria-labelledby="aboutTitle">
  <button class="close" type="button" aria-label="Close" data-i18n-aria="close">×</button>
  <div id="aboutBody"></div>
</dialog>

<dialog id="story" aria-labelledby="storyTitle">
  <button class="close" type="button" aria-label="Close" data-i18n-aria="close">×</button>
  <div id="storyBody"></div>
</dialog>

<script defer src="analytics.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
